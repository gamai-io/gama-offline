name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # dsc owns the only copy of the T1/T2 policy lists and the cache key
      # (pinned commit in requirements.txt); pure-stdlib package, so this is a
      # few seconds.
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - run: python3 -c "from dsc.cachekey import SCHEME, request_key; assert SCHEME == 'v2'"
      - run: python3 -m unittest discover -s tests -v
